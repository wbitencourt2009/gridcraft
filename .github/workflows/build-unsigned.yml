name: Build (unsigned, all platforms)

# Manual builds for a fork without the org's signing secrets: Run workflow on the Actions tab,
# then download the files from the run's Artifacts section.
#   - Windows x64: per-user installer (no administrator rights) + portable zip
#   - macOS universal (Apple silicon + Intel): ad-hoc signed DMG, not notarized
#   - Linux x86_64: AppImage, .deb, .rpm, .tar.gz
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (C runtime linked statically)
        shell: pwsh
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p gridcraft -p gridcraft-cli --target x86_64-pc-windows-msvc
      - name: Per-user installer and portable zip
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $bin = Resolve-Path target/x86_64-pc-windows-msvc/release
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" "/DBinDir=$bin" "/DOutDir=$(Resolve-Path dist)" packaging/windows/gridcraft-user.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$bin/gridcraft.exe", "$bin/gridcraft-cli.exe" -DestinationPath "dist/gridcraft-$version-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: gridcraft-windows-x64
          path: dist/*

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build universal app and DMG (ad-hoc signed)
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@v4
        with:
          name: gridcraft-macos-universal
          path: dist/release/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libfuse2 zsync file
          curl -sSfL -o /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Build AppImage, .deb, .rpm and .tar.gz
        run: packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gridcraft-linux-x86_64
          path: dist/release/*
